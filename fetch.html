<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Consulta de Deputados</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="style.css">
</head>

<body class="bg-light">

  <main class="container py-5">

    <h1 class="mb-4 text-center">
      Consultar Deputado Federal
    </h1>

    <form id="formBusca" class="mb-3">

      <label for="inputNome" class="form-label">
        Nome do deputado
      </label>

      <div class="input-group">

        <input
          type="text"
          id="inputNome"
          class="form-control"
          placeholder="Exemplo: Tiririca"
          minlength="3"
          required
        >

        <button type="submit" class="btn btn-primary">
          Pesquisar
        </button>

      </div>

    </form>

    <p
      id="mensagem"
      class="text-center"
      aria-live="polite"
    ></p>

    <div
      id="fotoDeputado"
      class="text-center mb-4"
    ></div>

    <div class="row g-3">

      <div class="col-md-6">

        <label for="nome" class="form-label">
          Nome civil
        </label>

        <input
          type="text"
          id="nome"
          class="form-control"
          readonly
        >

      </div>

      <div class="col-md-6">

        <label for="partido" class="form-label">
          Partido
        </label>

        <input
          type="text"
          id="partido"
          class="form-control"
          readonly
        >

      </div>

      <div class="col-md-6">

        <label for="uf" class="form-label">
          UF
        </label>

        <input
          type="text"
          id="uf"
          class="form-control"
          readonly
        >

      </div>

      <div class="col-md-6">

        <label for="email" class="form-label">
          E-mail
        </label>

        <input
          type="text"
          id="email"
          class="form-control"
          readonly
        >

      </div>

    </div>

  </main>

  <script src="script1.js"></script>

</body>
</html>
